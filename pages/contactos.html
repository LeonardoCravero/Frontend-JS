<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <header class ="navegacion">
        <h1>Sports Shop</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html">Productos</a></li>
                <li><a href="../pages/contactos.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="main">
        <h2>Formulario de Contacto</h2>
        <h3>¡Contactanos si tenes alguna pregunta o quja!</h3>
        <p>Por favor, completa el siguiente formulario con tu duda o queja y nos pondremos en contacto contigo lo antes posible.</p>
        <form class="formulario" action="https://formspree.io/f/xzededvn" method="post">
            <label>Nombre: 
                <input type="text" name="nombre" required>
            </label>
            <br>
            <label>Correo: 
                <input type="email" name="correo" required>
            </label>
            <br>
            <label>Mensaje: 
                <textarea name="mensaje" required></textarea>
            </label>
            <br>
            <button class="boton" type="submit">Enviar</button>
        </form>
    </main>
    <footer class="footer">

    </footer>
